name: Build

on: [push, pull_request]

jobs:
  prepare-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - id: set-matrix
        name: Prepare
        run: echo "matrix=$(node -p "JSON.stringify(require('./package.json').peerDependencies['cypress'].split(' || '))")" >> "$GITHUB_OUTPUT"
      - run: npm -v

  test:
    needs: prepare-versions
    runs-on: ubuntu-latest
    container:
      image: cypress/base:22.21.0
      # Why exactly 1001? See https://github.com/actions/checkout/issues/211 and https://github.com/actions/runner/issues/691.
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        cypress-version: ${{fromJson(needs.prepare-versions.outputs.matrix)}}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache Cypress binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress@${{ matrix.cypress-version }}
      - name: Dependencies (1)
        run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: "0"
      - name: Dependencies (2)
        run: npm install --no-save cypress@${{ matrix.cypress-version }}
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test
      - name: Version
        run: npx cypress --version
